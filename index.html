<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="하루 한 번 몸무게를 기록하고 흐름을 보는 앱">
<meta name="theme-color" content="#F7F6F3">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Weighly</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weighly">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — scrolling view on top, fixed tab bar below; sheets slide up from the bottom. */
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --fg:#1D1D1F; --sub:#6B6A6F; --faint:#A3A2A7;
  --line:#E6E4DF; --line2:#F0EEEA; --track:#ECEAE5;
  --accent:#2F5D50; --accentSoft:#E3ECE8; --accentInk:#1F3F36; --onAccent:#FFFFFF;
  --weekend:#8C2333; --danger:#B3261E; --btn:#1D1D1F; --btnFg:#FFFFFF;
  --scrim:rgba(20,20,22,.45); --disabled:#C2C1C5;
  --font:'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif;
}
/* light B = stone */
@media (prefers-color-scheme: light){:root[data-light="b"]:not([data-theme="dark"]){
  --bg:#F1F2F4; --card:#FFFFFF; --fg:#16181B; --sub:#61656C; --faint:#9EA2A8;
  --line:#E1E3E7; --line2:#EDEEF1; --track:#E6E8EC;
  --accent:#1C1E21; --accentSoft:#E7E8EB; --accentInk:#16181B; --onAccent:#FFFFFF;
  --btn:#16181B; --btnFg:#FFFFFF; --disabled:#C3C6CB;
}}
:root[data-theme="light"][data-light="b"]{
  --bg:#F1F2F4; --card:#FFFFFF; --fg:#16181B; --sub:#61656C; --faint:#9EA2A8;
  --line:#E1E3E7; --line2:#EDEEF1; --track:#E6E8EC;
  --accent:#1C1E21; --accentSoft:#E7E8EB; --accentInk:#16181B; --onAccent:#FFFFFF;
  --btn:#16181B; --btnFg:#FFFFFF; --disabled:#C3C6CB;
}
/* dark A = graphite (default dark), dark B = amber */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --card:#1A1B1E; --fg:#EDEDEE; --sub:#9C9DA2; --faint:#6E6F74;
  --line:#2A2B2F; --line2:#232427; --track:#2C2D31;
  --accent:#A9C7B9; --accentSoft:#1F2A26; --accentInk:#D5E6DE; --onAccent:#0F1012;
  --weekend:#D98C98; --danger:#EF7A70; --btn:#EDEDEE; --btnFg:#0F1012;
  --scrim:rgba(0,0,0,.65); --disabled:#45464A; color-scheme:dark;
}
:root:not([data-theme="light"])[data-dark="b"]{
  --bg:#121110; --card:#1C1B19; --fg:#EFEAE3; --sub:#A69F95; --faint:#746E66;
  --line:#2D2A27; --line2:#252320; --track:#302D29;
  --accent:#D6A55C; --accentSoft:#2D251A; --accentInk:#F0D9B5; --onAccent:#1A1408;
  --weekend:#E08F8F; --danger:#EF7A70; --btn:#EFEAE3; --btnFg:#121110;
  --scrim:rgba(0,0,0,.65); --disabled:#48443F;
}}
:root[data-theme="dark"]{
  --bg:#0F1012; --card:#1A1B1E; --fg:#EDEDEE; --sub:#9C9DA2; --faint:#6E6F74;
  --line:#2A2B2F; --line2:#232427; --track:#2C2D31;
  --accent:#A9C7B9; --accentSoft:#1F2A26; --accentInk:#D5E6DE; --onAccent:#0F1012;
  --weekend:#D98C98; --danger:#EF7A70; --btn:#EDEDEE; --btnFg:#0F1012;
  --scrim:rgba(0,0,0,.65); --disabled:#45464A; color-scheme:dark;
}
:root[data-theme="dark"][data-dark="b"]{
  --bg:#121110; --card:#1C1B19; --fg:#EFEAE3; --sub:#A69F95; --faint:#746E66;
  --line:#2D2A27; --line2:#252320; --track:#302D29;
  --accent:#D6A55C; --accentSoft:#2D251A; --accentInk:#F0D9B5; --onAccent:#1A1408;
  --weekend:#E08F8F; --danger:#EF7A70; --btn:#EFEAE3; --btnFg:#121110;
  --scrim:rgba(0,0,0,.65); --disabled:#48443F;
}
.zw{display:flex;flex-direction:column;gap:14px;zoom:var(--z,1)}
.zw.sz{gap:16px}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding-block:8px 6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--sub);font-size:11px;min-height:48px;justify-content:center}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab svg{width:24px;height:24px}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bars */
.top{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.top h1{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.sub{color:var(--sub);font-size:14px}
.small{font-size:12px;line-height:1.5;color:var(--sub)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;color:var(--fg)}
.iconbtn svg{width:22px;height:22px}
.ymbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;min-height:52px}
.ymbtn{border:0;background:none;display:flex;align-items:center;gap:4px;height:44px;padding:0 4px;font-weight:600}
.ymbtn svg{width:16px;height:16px}
.ymbtn.y{justify-self:start;font-size:17px}
.ymbtn.m{justify-self:center;font-size:20px;font-weight:700;position:relative}
.ymwrap{display:flex;flex-direction:column;gap:0}
.ymwrap .ymbtn.y{align-self:flex-start;height:34px;font-size:16px}
.mnav{justify-self:center;display:flex;align-items:center}
.mnav .ymbtn.m{margin:0 6px;min-width:64px;justify-content:center}
.lmon{padding:10px 16px 6px;font-size:13px;font-weight:600;color:var(--sub);background:var(--bg);border-bottom:1px solid var(--line2)}
.ymbtn.m svg{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:-2px}
.plus{justify-self:end;width:44px;height:44px;border-radius:22px;border:0;background:var(--btn);color:var(--btnFg);display:flex;align-items:center;justify-content:center}
.plus svg{width:22px;height:22px}

.card{background:var(--card);border-radius:20px;padding:18px 20px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 20px 20px;border-radius:24px}
.big{font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-1px}
.big small{font-size:22px;font-weight:500;letter-spacing:0;margin-left:4px}
.primary{width:100%;height:56px;border-radius:16px;border:0;background:var(--btn);color:var(--btnFg);font-size:17px;font-weight:600}
.secondary{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.textbtn{border:0;background:none;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}
.danger{color:var(--danger)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.accent{color:var(--accent)}
.goal{display:flex;flex-direction:column;gap:12px;border:0;text-align:left;width:100%}
.cheer{margin:6px 4px 0;font-size:14px;line-height:1.5;text-align:center;color:var(--accent)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accentSoft);color:var(--accentInk);border-radius:14px;padding:10px 14px;font-size:13px}
.banner button{border:0;background:none;color:var(--accentInk);font-weight:600;text-decoration:underline;min-height:40px;padding:0 4px;flex:none}

/* toggle */
.sw{width:51px;height:31px;border-radius:16px;border:0;padding:0;position:relative;background:var(--track);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{left:22px}
.sw:disabled{opacity:.45}
.seg{display:flex;background:var(--track);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;height:34px;padding:0 14px;font-size:13px;color:var(--sub)}
.seg.eq{width:168px;box-sizing:border-box}
.seg.eq button{flex:1 1 0;min-width:0;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* calendar */
.calcard{background:var(--card);border-radius:20px;padding:14px 8px 10px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.day{position:relative;height:62px;border:0;background:transparent;padding:6px 0 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);border-radius:12px}
.day:disabled{color:var(--disabled);cursor:default}
.day .n{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;box-sizing:border-box}
.day.today .n{border:1.5px solid var(--fg)}
.day .wv{font-size:11px;font-weight:600;color:var(--fg)}
.day .dt{width:6px;height:6px;border-radius:3px;background:var(--accent);margin-top:4px}
.day .n{position:relative}
.day .fl{position:absolute;top:3px;left:calc(100% - 5px);color:var(--accent);display:flex}
.day .fl svg{width:14px;height:14px;fill:currentColor}
.we{color:var(--weekend)}
.flaglist{display:flex;flex-direction:column;gap:6px}
.flagitem{display:flex;align-items:center;gap:8px;background:var(--card);border:0;border-radius:12px;padding:10px 12px;font-size:13px;text-align:left;min-height:44px}
.flagicon{width:13px;height:13px;fill:var(--accent);stroke:none;flex:none}
.c-star{fill:var(--accent)}
.dpinline{display:flex;flex-direction:column;gap:8px;padding:6px 0 14px;border-bottom:1px solid var(--line2);animation:fade .2s}
.dpick.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dph{display:flex;flex-direction:column;align-items:stretch}
.dph .ymbtn.y{align-self:flex-start}
.dph .mnav{align-self:center}
.dph .ymbtn.y{font-size:16px}
.dph .ymbtn.m{font-size:17px}
.dph .ymbtn[aria-pressed="true"]{color:var(--accent)}
.dpnav{justify-self:end;display:flex}
.qchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 0 12px;border-bottom:1px solid var(--line2)}
.qchip{height:34px;padding:0 4px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--fg);white-space:nowrap}
.spaced{letter-spacing:.3em;text-indent:.3em}
.srow.off .sublbl{opacity:.7}
.srow.idle .sublbl{opacity:.8}
.c-avg{fill:none;stroke:var(--sub);stroke-width:1.6;stroke-dasharray:4 3;stroke-linejoin:round;stroke-linecap:round}
.avgtog{border:1px solid var(--line);background:var(--card);border-radius:14px;height:30px;padding:0 10px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.avgtog i{width:14px;height:0;border-top:2px dashed currentColor}
.avgtog[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
#tut{position:fixed;inset:0;z-index:75;background:rgba(20,20,22,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.tutbox{position:relative;width:min(340px,100%);height:354px;max-height:calc(100% - 20px);box-sizing:border-box;background:var(--card);border-radius:24px;padding:28px 18px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:fade .2s}
.tutic{width:56px;height:56px;border-radius:28px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;align-self:center;overflow:hidden}
.tutic svg{width:28px;height:28px}
.tutic.logo{background:none;border-radius:14px}
.tutic.logo img{display:block;width:56px;height:56px}
.tutbox > *{flex-shrink:0}
.tutskip{position:absolute;top:10px;right:12px;border:0;background:none;font-size:13px;color:var(--sub);min-height:36px;padding:0 6px}
.dacts button:disabled{opacity:.4;cursor:default}
.tutbox h3{margin:10px 0 2px;font-size:18px;line-height:1.35;white-space:nowrap;letter-spacing:-.2px}
.tbody{display:flex;flex-direction:column;gap:6px}
.tutbox h3 .pron{font-size:14px;font-weight:600;color:var(--sub)}
.tutbox p{margin:0;font-size:14px;line-height:1.5;color:var(--sub);white-space:pre-line}
.tutbox p b{color:var(--accent);font-weight:700}
.tdots{display:flex;gap:6px;justify-content:center;margin-top:auto;padding-top:6px}
.tdots i{width:6px;height:6px;border-radius:3px;background:var(--line)}
.tdots i.on{background:var(--fg);width:16px}
.srow.idle .seg button[aria-pressed="true"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint);color:var(--fg)}
.dpinline{position:relative}
.dpov{position:absolute;top:50px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:6px}
.dpov button{height:40px;border:0;background:none;border-radius:10px;font-size:15px;color:var(--fg)}
.dpov button[aria-pressed="true"]{background:var(--btn);color:var(--btnFg);font-weight:600}
.dpov button:disabled{color:var(--disabled)}
.dpov-y{top:40px;left:0;width:132px;max-height:264px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.dpov-m{top:88px;left:50%;transform:translateX(-50%);width:252px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ph{color:var(--faint);font-weight:500}
.seg button:disabled{opacity:.7;cursor:default}
.sublbl{padding-left:16px;font-size:14px;color:var(--sub)}
.tip{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.5;color:var(--sub);margin:0}
.tip svg{width:14px;height:14px;flex:none;color:var(--faint)}
.dpn{width:44px;height:44px;border:0;background:none;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.dpn:disabled{color:var(--disabled)}
.dpn svg{width:20px;height:20px}
.dpg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dpd{height:40px;border:0;border-radius:20px;background:none;font-size:15px;padding:0}
.dpd.we{color:var(--weekend)}
.dpd.tdy{box-shadow:inset 0 0 0 1.5px var(--fg)}
.dpd.sel{background:var(--btn);color:var(--btnFg);box-shadow:none}
.dpd:disabled{color:var(--disabled);cursor:default}

/* list */
.lcard{background:var(--card);border-radius:20px}
.lgrid{display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));align-items:center;text-align:center}
.lhead{padding:12px 30px 12px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);position:sticky;top:0;z-index:3;background:var(--card);border-radius:20px 20px 0 0}
.lgrid > :first-child{text-align:center;justify-content:center}
.swipe{position:relative;height:52px;border-bottom:1px solid var(--line2);overflow:hidden}
.swipe:last-child{border-bottom:0;border-radius:0 0 20px 20px}
.swipe .delbtn{position:absolute;right:0;top:0;width:80px;height:100%;border:0;background:var(--danger);color:#FFFFFF;font-size:14px;font-weight:600}
.row-fg{position:absolute;inset:0;background:var(--card);border:0;padding:0 30px 0 14px;font-size:15px;transition:transform .2s;width:100%}
.row-fg.open{transform:translateX(-80px)}
.row-fg .d{font-size:14px;position:relative;display:flex;justify-content:center;align-items:center}
.row-fg .d > span:first-child > span{margin-left:8px}
.row-fg .d .dstar{position:absolute;left:calc(50% + 36px);top:50%;transform:translateY(-50%);display:flex}
.lgrid.wo{grid-template-columns:84px minmax(0,1fr)}
.rangebtn{border:0;background:none;padding:0;display:flex;align-items:center;gap:4px;font-size:13px;min-height:36px;color:var(--sub)}
.chartcard .rangebtn svg{width:14px;height:14px;display:inline;flex:none}
svg.chart{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.c-tipl{stroke:var(--fg);stroke-width:1;opacity:.35}
.c-tipd{fill:var(--accent);stroke:var(--card);stroke-width:2}
.c-tipb{fill:var(--btn)}
.c-tipt1{fill:var(--btnFg);font-size:9.5px;opacity:.8;font-family:var(--font)}
.c-tipt2{fill:var(--btnFg);font-size:12px;font-weight:700;font-family:var(--font)}
.row-fg .dw{color:var(--sub)}
.row-fg .w{font-weight:inherit}
.dash{color:var(--faint)}
.empty{color:var(--sub);text-align:center;padding:28px 12px;font-size:14px;margin:0}

/* chart */
.htabs{display:flex;gap:16px;align-items:baseline}
.htabs button{border:0;background:none;padding:0;font-size:24px;font-weight:700;color:var(--faint);min-height:44px}
.htabs button[aria-current="page"]{color:var(--fg)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnFg);border-color:var(--btn);font-weight:600}
.chartcard{background:var(--card);border-radius:20px;padding:16px 12px 14px;display:flex;flex-direction:column;gap:12px}
.chartcard svg{width:100%;height:auto;display:block}
.periods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.periods button{height:36px;border:0;border-radius:9px;background:transparent;font-size:13px;color:var(--sub)}
.periods button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:18px}
.c-grid{stroke:var(--track);stroke-width:1}
.c-lab{fill:var(--sub);font-size:9.5px;font-family:var(--font)}
.c-axt{fill:var(--sub);font-size:9.5px;font-weight:600;font-family:var(--font)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);opacity:.1}
.c-dot{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-end{fill:var(--accent)}
.c-val{fill:var(--fg);font-size:13px;font-weight:700;font-family:var(--font);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.c-flag{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.c-flagbox{fill:var(--accent)}
.c-flagtxt{fill:var(--onAccent);font-size:10.5px;font-family:var(--font)}
.tbl{background:var(--card);border-radius:20px;overflow:hidden}
.tbl .r{display:flex;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:15px}
.tbl .r:last-child{border-bottom:0}

/* archive */
.acard{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent;text-align:left;width:100%}
.acard.live{border-color:var(--accent)}
.badge{font-size:12px;font-weight:600;border-radius:11px;height:22px;min-width:76px;padding:0 9px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;flex:none}
.b-live{color:var(--accent);background:var(--accentSoft)}
.b-done{color:var(--onAccent);background:var(--accent)}
.b-plain{color:var(--sub);background:var(--line2)}
.aval{font-size:20px;font-weight:700}
.aval small{font-size:14px;font-weight:500}
.spark{width:110px;height:36px;flex:none}
.spark polyline{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acard.live .spark polyline{stroke:var(--accent)}
.pill{height:40px;padding:0 14px;border:0;border-radius:20px;background:var(--btn);color:var(--btnFg);font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.pill svg{width:16px;height:16px}

/* settings */
.stitle{font-size:13px;font-weight:600;color:var(--sub);padding:10px 4px 0}
.group{background:var(--card);border-radius:16px;padding:0 16px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:65px;box-sizing:border-box;border-bottom:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-top:0;padding:15px 0;text-align:left;font-size:15px;line-height:1.4}
.srow > *{min-height:34px;display:flex;align-items:center}
.srow > .lbl{min-height:0}
.srow .seg{padding:2px;box-sizing:border-box;height:34px}
.srow .seg button{height:30px}
.srow:last-child{border-bottom:0}
.srow .lbl{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.srow .lbl > *{line-height:1.3}
.chev{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ver{text-align:center;font-size:12px;color:var(--faint);padding:8px 0}

/* layers */
#layer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;box-sizing:border-box;padding-top:10px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h2{margin:0;font-size:19px;font-weight:700}
.xbtn{width:44px;height:44px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;margin-right:-10px}
.xbtn svg{width:22px;height:22px}
.fields{display:flex;flex-direction:column}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line2)}
.frow label,.flabel{font-size:15px;color:var(--sub)}
.frow .opt{font-size:12px}
.unitin{display:flex;align-items:center;justify-content:flex-end;width:164px;height:44px;box-sizing:border-box;padding:0 12px;border-radius:10px;background:var(--bg);flex:none}
.unitin:focus-within{box-shadow:inset 0 0 0 1.5px var(--fg)}
.unitin span{font-size:15px;font-weight:500;color:var(--sub);margin-left:4px;flex:none}
.nin{flex:1;min-width:0;width:100%;height:40px;border:0;background:transparent;text-align:right;padding:0;font-size:17px;font-weight:600;outline:none}
.nin:focus-visible{outline:none}
.din{display:flex;align-items:center;justify-content:flex-end;width:164px;height:44px;box-sizing:border-box;border:0;border-radius:10px;padding:0 12px;background:var(--bg);font-size:17px;font-weight:600;flex:none}
.dpick{position:relative;display:inline-flex;align-items:center;justify-content:flex-end;width:164px;height:44px;box-sizing:border-box;flex:none;padding:0 12px;border:0;border-radius:10px;background:var(--bg);color:var(--fg);font-size:17px;font-weight:600}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--accentSoft);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none}
.avatar svg{width:22px;height:22px}
.tin{flex:1;min-width:0;height:44px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.flagbtn{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0}
.flagbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.flagbtn svg{width:20px;height:20px}
.err{color:var(--danger);font-size:13px;margin:0;text-align:center}
.warn{color:var(--weekend);font-size:12px;line-height:1.5;margin:0}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,calc(100% - 40px));background:var(--card);border-radius:20px;padding:24px 20px 16px;display:flex;flex-direction:column;gap:10px;animation:fade .15s}
.dialog h3{margin:0;font-size:18px;line-height:1.45;text-align:center;white-space:pre-line}
.dialog p{margin:0;font-size:15px;line-height:1.55;text-align:center;color:var(--sub)}
.dacts{display:flex;gap:8px;margin-top:10px}
.dacts button{flex:1;height:48px;border-radius:12px;border:0;font-size:15px;font-weight:600;background:var(--line2)}
.dacts .go{background:var(--btn);color:var(--btnFg)}
.dacts .bad{background:var(--danger);color:#FFFFFF}
.picky{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.picky button,.pickm button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;padding:0 16px;flex:none}
.pickm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.picky button[aria-pressed="true"],.pickm button[aria-pressed="true"]{background:var(--btn);color:var(--btnFg);border-color:var(--btn);font-weight:600}
.pickm button:disabled{color:var(--disabled)}
textarea{width:100%;box-sizing:border-box;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;background:var(--bg);resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnFg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:70;pointer-events:none;animation:fade .2s}

/* lock */
#lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.dots{display:flex;gap:16px}
.dots i{width:14px;height:14px;border-radius:7px;border:1.5px solid var(--fg)}
.dots i.on{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:36px;border:0;background:var(--card);font-size:26px;font-weight:500}
.pad button.blank{visibility:hidden}
.pad button.padtxt{background:none;font-size:16px;font-weight:600;color:var(--accent)}
.shake{animation:shake .35s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

function sampleState(){

    const r = { w: +w.toFixed(1) };

    s.records[addDays(t, -i)] = r;

  const fk = addDays(t, -21);
  s.records[fk] = Object.assign(s.records[fk] || {}, { memo:'운동 시작', flag:true });
  const ks = Object.keys(s.records).sort();
  const gStart = ks.find(k => k >= addDays(t, -21) && s.records[k].w != null) || ks[0];
  s.goal = { start:gStart, startW:s.records[gStart].w, target:55.0, end:addDays(t, 52) };
  const pts = []; let v = 61.2;
  for (let i = 0; i <= 13; i++) { pts.push([addDays(t, -170 + i*7), +v.toFixed(1)]); v -= 0.18 + (i % 3 === 0 ? -0.05 : 0.02); }

  return s;
}

/* ---------- goal checks ---------- */
function seriesBetween(a, b){ return weightKeys().filter(k => k >= a && k <= b).map(k => [k, S.records[k].w]); }
function archiveGoal(type, endK){
  const g = S.goal; if (!g) return;
  const pts = seriesBetween(g.start, endK);
  const endW = pts.length ? pts[pts.length-1][1] : g.startW;
  S.archive.push({ id:'a'+Date.now(), auto:true, title:'',
    type, start:g.start, end:endK, startW:g.startW, endW, target:g.target, pts });
  S.goal = null; persist();
}
function checkGoal(onlyEnd){
  const g = S.goal; if (!g) return;
  const lw = latestW();
  if (!onlyEnd && lw && lw.k >= g.start) {
    const down = g.startW > g.target;
    if ((down && lw.w <= g.target) || (!down && lw.w >= g.target)) {
      archiveGoal('achieved', lw.k);
      dialog(t('achievedTitle'), t('achievedText'), [{label:t('ok')}, {label:t('newGoal'), kind:'go', fn:openGoal}]);
      return;
    }
  }
  if (g.end && todayK() > g.end) {
    archiveGoal('ended', g.end);
    dialog(t('endedTitle'), t('endedText'), [{label:t('ok')}, {label:t('newGoal'), kind:'go', fn:openGoal}]);
  }
}

function metricVal(r, met){ const x = r[met]; if (x == null) return null; return met === 'f' ? x : toU(x); }
let CHARTS = {}, chartSeq = 0;
function buildChart(pts, k0, k1, flags, unitLbl, avg, yName){
  if (pts.length < 2) return `<p class="empty">${t('notEnough')}</p>`;
  const cid = 'ch' + (++chartSeq);
  const W = 340, H = 236, Lm = 42, Rm = 13, Tm = 28, Bm = 30;
  const span = Math.max(1, diffDays(k0, k1));
  const vals = pts.map(p => p[1]);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  const pd = Math.max((mx - mn) * 0.18, 0.3); mn -= pd; mx += pd;
  const X = k => Lm + (diffDays(k0, k) / span) * (W - Lm - Rm);
  const Y = v => Tm + (mx - v) / (mx - mn) * (H - Tm - Bm);
  const ticks = [mx, (mx + mn) / 2, mn];
  CHARTS[cid] = { W, unit:unitLbl, pts:pts.map(p => ({ k:p[0], v:p[1], x:X(p[0]), y:Y(p[1]) })) };
  let s = `<svg id="${cid}" class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(md(pts[0][0]) + ' ' + pts[0][1].toFixed(1) + ' → ' + md(pts[pts.length-1][0]) + ' ' + pts[pts.length-1][1].toFixed(1) + unitLbl)}">`;
  ticks.forEach(v => { const yy = Y(v).toFixed(1); s += `<line class="c-grid" x1="${Lm}" y1="${yy}" x2="${W - Rm}" y2="${yy}"/><text class="c-lab" x="${Lm - 10}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`; });
  (flags || []).forEach(f => { if (f[0] < k0 || f[0] > k1) return; const xx = X(f[0]);
    if (span <= 31) {
      const txt = String(f[1]).slice(0, 7), bw = Math.max(40, txt.length * 10.5 + 16);
      const bx = Math.max(Lm, Math.min(xx - bw / 2, W - Rm - bw));
      s += `<line class="c-flag" x1="${xx.toFixed(1)}" y1="27" x2="${xx.toFixed(1)}" y2="${H - Bm}"/><rect class="c-flagbox" x="${bx.toFixed(1)}" y="4" width="${bw.toFixed(1)}" height="18" rx="4"/><text class="c-flagtxt" x="${(bx + bw / 2).toFixed(1)}" y="16" text-anchor="middle">${esc(txt)}</text>`;
    } else {
      s += `<line class="c-flag" x1="${xx.toFixed(1)}" y1="21" x2="${xx.toFixed(1)}" y2="${H - Bm}"/><path class="c-star" transform="translate(${(xx - 7).toFixed(1)} 2) scale(.5833)" d="${STAR}"/>`;
    } });
  const line = pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  const lx = X(pts[pts.length-1][0]), ly = Y(pts[pts.length-1][1]);
  s += `<path class="c-area" d="M${X(pts[0][0]).toFixed(1)},${H - Bm} L${line.replace(/ /g, ' L')} L${lx.toFixed(1)},${H - Bm} Z"/>`;
  if (avg && pts.length >= 3) {
    const ap = pts.map(p => { const lo = addDays(p[0], -6), vs = pts.filter(q => q[0] >= lo && q[0] <= p[0]).map(q => q[1]); return X(p[0]).toFixed(1) + ',' + Y(vs.reduce((a, b) => a + b, 0) / vs.length).toFixed(1); }).join(' ');
    s += `<polyline class="c-avg" points="${ap}"/>`;
  }
  const lw = span <= 8 ? 2.5 : span <= 31 ? 2 : span <= 92 ? 1.6 : 1.3;
  s += `<polyline class="c-line" points="${line}" style="stroke-width:${lw}"/>`;
  const dotR = span <= 8 ? 3.5 : 2.2, endR = span <= 8 ? 5 : span <= 31 ? 4 : 3;
  if (span <= 31 && pts.length <= 31) pts.slice(0, -1).forEach(p => { s += `<circle class="c-dot" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${dotR}"/>`; });
  s += `<circle class="c-end" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${endR}"/>`;
  s += `<text class="c-val" x="${Math.min(lx, W - Rm - 4).toFixed(1)}" y="${(ly > H/2 ? ly - 10 : ly + 20).toFixed(1)}" text-anchor="end">${pts[pts.length-1][1].toFixed(1)}</text>`;
  const mid = addDays(k0, Math.round(span / 2));
  [[k0,'start'],[mid,'middle'],[k1,'end']].forEach(([k, a]) => { s += `<text class="c-lab" x="${X(k).toFixed(1)}" y="${H - Bm + 19}" text-anchor="${a}">${md(k)}</text>`; });
  s += `<g class="c-tip" style="display:none"><line class="c-tipl" x1="0" y1="${Tm - 6}" x2="0" y2="${H - Bm}"/><circle class="c-tipd" r="5"/><rect class="c-tipb" rx="6" width="94" height="32"/><text class="c-tipt1" text-anchor="middle"></text><text class="c-tipt2" text-anchor="middle"></text></g>`;
  return s + '</svg>';
}
let tipSvg = null;
function tipAt(el, clientX){
  const c = CHARTS[el.id]; if (!c || !c.pts.length) return;
  const r = el.getBoundingClientRect(); const x = (clientX - r.left) * (c.W / r.width);
  let b = c.pts[0]; for (const p of c.pts) if (Math.abs(p.x - x) < Math.abs(b.x - x)) b = p;
  const g = el.querySelector('.c-tip'); g.style.display = '';
  const ln = g.querySelector('.c-tipl'); ln.setAttribute('x1', b.x); ln.setAttribute('x2', b.x);
  const d = g.querySelector('.c-tipd'); d.setAttribute('cx', b.x); d.setAttribute('cy', b.y);
  const bw = 94, bh = 32, bx = Math.min(Math.max(b.x - bw / 2, 2), c.W - bw - 2); let by = b.y - bh - 12; if (by < 2) by = b.y + 12;
  const rc = g.querySelector('.c-tipb'); rc.setAttribute('x', bx); rc.setAttribute('y', by);
  const t1 = g.querySelector('.c-tipt1'), t2 = g.querySelector('.c-tipt2');
  t1.setAttribute('x', bx + bw / 2); t1.setAttribute('y', by + 13); t1.textContent = fullDate(b.k);
  t2.setAttribute('x', bx + bw / 2); t2.setAttribute('y', by + 26.5); t2.textContent = b.v.toFixed(1) + c.unit;
}
document.addEventListener('pointerdown', e => { const s = e.target.closest && e.target.closest('svg.chart'); if (!s) return; tipSvg = s; try { s.setPointerCapture(e.pointerId); } catch(_) {} tipAt(s, e.clientX); });
document.addEventListener('pointermove', e => { if (tipSvg) tipAt(tipSvg, e.clientX); });
const tipEnd = () => { if (tipSvg) { const g = tipSvg.querySelector('.c-tip'); if (g) g.style.display = 'none'; tipSvg = null; } };
document.addEventListener('pointerup', tipEnd); document.addEventListener('pointercancel', tipEnd);

function periodRange(p){
  const tk = todayK();
  if (p === 7) return [addDays(tk, -6), tk];
  const n = ({ 30:1, 90:3, 182:6, 365:12 })[p] || 1;
  return [addDays(addMonths(tk, -n), 1), tk];
}

function spark(pts){

const LIM = { w:[20, 300], f:[2, 75], m:[5, 80] };

/* ---------- PIN / lock ---------- */
const lockEl = document.getElementById('lock');
let pinBuf = '', pinMode = null, pinFirst = '';
function padHtml(msg, sub){
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><b style="font-size:18px">${esc(msg)}</b>${sub ? `<span class="small" style="max-width:280px;white-space:pre-line">${esc(sub)}</span>` : ''}</div>
  <div class="dots" id="pinDots" aria-hidden="true">${[0,1,2,3].map(i => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="pinKey" data-v="${n}" class="num">${n}</button>`).join('')}
    ${pinMode !== 'unlock' ? `<button class="padtxt" data-act="pinCancel">${t('cancel')}</button>` : '<button class="blank" tabindex="-1" aria-hidden="true"></button>'}<button data-act="pinKey" data-v="0" class="num">0</button><button data-act="pinKey" data-v="del" aria-label="del">⌫</button></div>
`;
}
function showPin(mode, msg, sub){ pinMode = mode; pinBuf = ''; lockEl.innerHTML = padHtml(msg, sub); lockEl.hidden = false; lockEl.dataset.msg = msg; lockEl.dataset.sub = sub || ''; }
function pinKey(v){
  if (v === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += v;
  lockEl.innerHTML = padHtml(lockEl.dataset.msg, lockEl.dataset.sub);
  if (pinBuf.length < 4) return;
  const code = pinBuf;
  setTimeout(() => {
    if (pinMode === 'unlock') {
      if (code === S.settings.pin) { lockEl.hidden = true; UI.unlocked = true; }
      else { lockEl.dataset.sub = t('pinWrong'); pinBuf = ''; lockEl.innerHTML = padHtml(lockEl.dataset.msg, lockEl.dataset.sub); const d = document.getElementById('pinDots'); if (d) d.classList.add('shake'); }
    } else if (pinMode === 'verify') {
      if (code === S.settings.pin) showPin('set1', t('pinNew'), t('pinWarn'));
      else { lockEl.dataset.sub = t('pinWrong'); pinBuf = ''; lockEl.innerHTML = padHtml(lockEl.dataset.msg, lockEl.dataset.sub); const d = document.getElementById('pinDots'); if (d) d.classList.add('shake'); }
    } else if (pinMode === 'set1') { pinFirst = code; showPin('set2', t('pinAgain'), t('pinWarn')); }
    else if (pinMode === 'set2') {
      if (code === pinFirst) { S.settings.pin = code; S.settings.lock = true; persist(); lockEl.hidden = true; render(true); toast(t('lockOn')); }

}

/* ---------- swipe to delete ---------- */
let sw = null, suppress = false;
function closeSwipes(except){ document.querySelectorAll('.row-fg.open').forEach(el => { if (el !== except) el.classList.remove('open'); }); }
view.addEventListener('touchstart', e => { const fg = e.target.closest('.row-fg'); if (!fg) { closeSwipes(); return; } closeSwipes(fg);
  sw = { fg, x:e.touches[0].clientX, y:e.touches[0].clientY, base:fg.classList.contains('open') ? -80 : 0, dx:0, lock:null }; }, { passive:true });
view.addEventListener('touchmove', e => { if (!sw) return; const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (sw.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (sw.lock !== 'x') return; sw.dx = dx; const v = Math.min(0, Math.max(-100, sw.base + dx));
  sw.fg.style.transition = 'none'; sw.fg.style.transform = `translateX(${v}px)`; }, { passive:true });
view.addEventListener('touchend', () => { if (!sw) return;
  if (sw.lock === 'x') { const open = sw.base + sw.dx < -40; sw.fg.style.transition = ''; sw.fg.style.transform = ''; sw.fg.classList.toggle('open', open); suppress = true; setTimeout(() => suppress = false, 350); }
  sw = null; });

/* ---------- actions ---------- */
document.addEventListener('click', e => {

  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'tab': UI.tab = v; closeSwipes(); render(); break;
    case 'toggleHide': S.settings.hideNum = !S.settings.hideNum; persist(); render(true); break;
    case 'recordToday': openRecord(todayK(), 'new'); break;
    case 'addRecord': openRecord(todayK(), 'new'); break;
    case 'dayTap': { const k = el.dataset.k; openRecord(k, S.records[k] ? 'edit' : 'new'); break; }
    case 'editRow': if (suppress) return; if (el.classList.contains('open')) { el.classList.remove('open'); return; } openRecord(el.dataset.k, 'edit'); break;
    case 'askDelete': askDelete(el.dataset.k); break;
    case 'flagTog': el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); break;
    case 'closeSheet': closeSheet(); break;
    case 'dlg': { const act = dlgActs[+el.dataset.i]; closeDialog(); if (act && act.fn) act.fn(); break; }
    case 'dlgCancel': closeDialog(); break;
    case 'pickYM': openPicker(el.dataset.ctx); break;
    case 'openGoal': openGoal(); break;
    case 'editName': openName(); break;
    case 'dpOpen': dpOpen(el); break;
    case 'dpPick': dpPick(el.dataset.k); break;
    case 'dpClose': dpClose(); break;
    case 'dpMode': dp.mode = dp.mode === v ? 'd' : v; dpDraw(); break;
    case 'dpY': dp.y = +v; dp.mode = 'm'; dpDraw(); break;
    case 'dpM': dp.m = +v; dp.mode = 'd'; dpDraw(); break;
    case 'gQuick': goalQuick(+v); break;
    case 'editArch': openRange(el.dataset.id); break;
    case 'dpNav': dp.mode = 'd'; dp.m += +v; if (dp.m < 0) { dp.m = 11; dp.y--; } if (dp.m > 11) { dp.m = 0; dp.y++; } dpDraw(); break;
    case 'privacy': openPrivacy(); break;
    case 'contact': openContact(); break;
    case 'copyAddr': { const tx = document.getElementById('ctAddr').textContent; try { navigator.clipboard.writeText(tx).then(() => toast(t('copied')), () => toast(t('copyFail'))); } catch(err) { toast(t('copyFail')); } break; }
    case 'removeGoal': dialog(t('removeGoalQ'), '', [{label:t('cancel')}, {label:t('del'), kind:'bad', fn:() => { S.goal = null; persist(); closeSheet(); render(true); }}]); break;
    case 'chartSub': UI.chartSub = v; render(); break;
    case 'chartMode': UI.chartMode = v; render(true); break;
    case 'metric': UI.metric = v; render(true); break;
    case 'period': UI.period = +v; UI.custom = null; render(true); break;
    case 'chartRange': openChartRange(el.dataset.a, el.dataset.b); break;
    case 'resetRange': UI.custom = null; closeSheet(); render(true); break;
    case 'items': S.settings.items = v; persist(); render(true); break;
    case 'theme': S.settings.theme = v; persist(); render(true); break;
    case 'dstyle': S.settings.darkStyle = v; persist(); render(true); break;
    case 'lstyle': S.settings.lightStyle = v; persist(); render(true); break;
    case 'fs': S.settings.fs = v; persist(); render(true); break;
    case 'newRange': openRange(); break;
    case 'openArch': openArch(el.dataset.id); break;
    case 'delArch': { const id = el.dataset.id; dialog(t('deleteArchiveQ'), '', [{label:t('cancel')}, {label:t('del'), kind:'bad', fn:() => { S.archive = S.archive.filter(x => x.id !== id); persist(); closeSheet(); render(true); }}]); break; }
    case 'lang': S.settings.lang = v; persist(); render(true); break;
    case 'unit': S.settings.unit = v; persist(); render(true); if (!document.getElementById('tut').hidden) showTut(tutI); break;
    case 'week': S.settings.weekStart = +v; persist(); render(true); break;
    case 'toggleLock':
      if (S.settings.lock) dialog(t('lockOffQ'), '', [{label:t('cancel')}, {label:t('turnOff'), kind:'bad', fn:() => { S.settings.lock = false; S.settings.pin = null; persist(); render(true); }}]);
      else showPin('set1', t('pinNew'), t('pinWarn'));
      break;
    case 'changePin': showPin('verify', t('pinCur')); break;
    case 'monNav': { const c = el.dataset.ctx, ky = c === 'cal' ? ['calY','calM'] : ['listY','listM']; let yy = UI[ky[0]], mm = UI[ky[1]] + +v; if (mm < 0) { mm = 11; yy--; } if (mm > 11) { mm = 0; yy++; } UI[ky[0]] = yy; UI[ky[1]] = mm; if (c === 'list') UI.listN = 1; render(); break; }
    case 'moreMonth': UI.listN = (UI.listN || 1) + 1; render(true); break;
    case 'pinKey': pinKey(v); break;
    case 'pinCancel': lockEl.hidden = true; pinMode = null; break;
    case 'exportB': exportBackup(); break;
    case 'exportCSV': exportCSV(); break;
    case 'avgTog': S.settings.avgLine = S.settings.avgLine === false; persist(); render(true); break;
    case 'tutPrev': if (tutI > 0) showTut(tutI - 1); break;
    case 'tutNext': if (tutI < TUT.length - 1) showTut(tutI + 1); else endTut(); break;
    case 'tutSkip': endTut(); break;
    case 'tutAgain': showTut(0); break;
    case 'copyEx': { const ta = document.getElementById('exTxt');
      const fallback = () => { ta.focus(); ta.select(); toast(t('copyFail')); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast(t('copied')), fallback); } catch(err) { fallback(); } break; }
    case 'importB': importBackup(); break;
    case 'doImport': doImport(); break;
    case 'clearSample': dialog(t('clearSampleQ'), '', [{label:t('cancel')}, {label:t('erase'), kind:'bad', fn:() => { const st = S.settings; S = defaults(); S.settings = st; persist(); render(); }}]); break;
    case 'clearAll': dialog(t('clearAllQ'), '', [{label:t('cancel')}, {label:t('erase'), kind:'bad', fn:() => { const st = S.settings; S = defaults(); S.settings = st; persist(); render(); }}]); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.querySelector('.dpinline')) dpClose(); else if (document.querySelector('.dlgwrap')) closeDialog(); else if (!layer.hidden) closeSheet(); } });

/* ---------- boot ---------- */
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(true)); } catch(_) {}
render();
checkGoal(true);
if (!S.settings.tutSeen) showTut(0);
if (S.settings.lock && S.settings.pin) showPin('unlock', t('pinEnter'));
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
</html>
